# Floors for transitive dependencies with published advisories (vulnwatch,
# 2026-10-23). Each only lifts versions below the fixed one, so a parent that
# already needs something newer (next pins postcss 8.5.23) is left alone.
overrides:
  "postcss@<8.5.18": ">=8.5.18"
  "nanoid@>=3 <3.3.18": "^3.3.18"
  "zod@>=4 <4.6.6": "^4.6.6"
  "brace-expansion@>=1 <1.1.21": "^1.1.21"
  "brace-expansion@>=5 <5.0.11": "^5.0.11"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "source-map-js@<1.2.2": "^1.2.2"
  "sharp@<0.35.5": "^0.35.5"

# unrs-resolver (via eslint) ships prebuilt binaries; its install script is
# not needed.
allowBuilds:
  unrs-resolver: false
