[project]
name = "wa-app"
version = "0.1.0"
description = "Self-hosted chat PWA riding the whatsapp-mcp-pro bridge"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.3.1",
    "uvicorn>=0.23.2",
    "argon2-cffi>=23.1.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "cryptography>=50.0.2",
]

[project.scripts]
wa-app = "wa_app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wa_app"]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
