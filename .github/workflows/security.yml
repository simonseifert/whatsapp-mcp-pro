name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Follows go.mod's toolchain line, so the scan checks the Go the
          # bridge is actually built with. A pinned patch here went stale and
          # failed every scan from August on.
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Run govulncheck
        working-directory: whatsapp-bridge
        run: |
          # Pinned: @latest moved to a release that needs a newer Go than the
          # bridge's toolchain, and GOTOOLCHAIN=local forbids fetching one.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: whatsapp-mcp-server
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: whatsapp-mcp-server
        run: |
          pip-audit -r requirements.txt || true

  docker-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Dockerfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # Don't fail, just report

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
