name: wactl tests

# wactl's own unit tests and lint, on the three operating systems it supports.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wactl'
      - 'wactl.cmd'
      - '.github/workflows/wactl-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'wactl'
      - 'wactl.cmd'
      - '.github/workflows/wactl-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wactl:
    name: wactl (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Unit tests
        run: uv run --with pytest pytest -q scripts/tests

      - name: Lint
        run: uvx ruff check scripts

      - name: Format check
        run: uvx ruff format --check scripts
