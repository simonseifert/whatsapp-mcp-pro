name: Go Tests

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-bridge/**'
      - '.github/workflows/go-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'whatsapp-bridge/**'
      - '.github/workflows/go-test.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # mattn/go-sqlite3 needs cgo; windows-latest ships mingw gcc.
      CGO_ENABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Install dependencies
        shell: bash
        run: |
          cd whatsapp-bridge
          go mod download

      - name: Run tests
        shell: bash
        run: |
          cd whatsapp-bridge
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          file: whatsapp-bridge/coverage.out
          flags: go
          fail_ci_if_error: false

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Build
        shell: bash
        run: |
          cd whatsapp-bridge
          go build -v ./...
