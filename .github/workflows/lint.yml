name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      # golangci-lint refuses to lint code targeting a newer Go than it was built
      # with, so build it with the toolchain go.mod pins. A prebuilt binary or a
      # pinned go-version broke this job every time go.mod's toolchain moved.
      - name: Install golangci-lint
        working-directory: whatsapp-bridge
        run: |
          export GOTOOLCHAIN="$(awk '/^toolchain /{print $2}' go.mod)"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        working-directory: whatsapp-bridge
        run: |
          export GOTOOLCHAIN="$(awk '/^toolchain /{print $2}' go.mod)"
          golangci-lint run --timeout=5m

  python-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check whatsapp-mcp-server/

      - name: Run ruff format check
        run: ruff format --check whatsapp-mcp-server/

  dockerfile-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.bridge
          failure-threshold: error

      - name: Lint MCP Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.mcp
          failure-threshold: error
