version: 2
updates:
  - package-ecosystem: gomod
    directory: /whatsapp-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to a pseudo-version; bumps need deliberate testing against live
      # WhatsApp. Tracked by .github/workflows/upstream-watch.yml instead.
      - dependency-name: go.mau.fi/whatsmeow
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /whatsapp-mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
